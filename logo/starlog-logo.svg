<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Starlog logo">
  <title>Starlog — orbit mark</title>
  <!-- Primary mark from the plan's visual-brand sheet (section 07):
       coral journal core (#F16E56) + navy orbit ring (#193346). -->
  <g transform="rotate(-18 120 120)" fill="none" stroke="#193346" stroke-width="14" stroke-linecap="round">
    <path d="M 16 120 A 104 38 0 0 1 224 120"/>
  </g>
  <circle cx="120" cy="120" r="72" fill="#F16E56"/>
  <g transform="rotate(-18 120 120)" fill="none" stroke="#193346" stroke-width="14" stroke-linecap="round">
    <path d="M 16 120 A 104 38 0 0 0 224 120"/>
  </g>
</svg>
