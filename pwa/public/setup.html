<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Starlog — Setup</title>
<link rel="icon" type="image/svg+xml" href="/icons/starlog.svg" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #f5f3ec; color: #1a1a1a;
    font-family: system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; color: #f5f3ec; }
    input { background: #2a2a2a !important; border-color: #444 !important; color: #f5f3ec !important; }
  }
  .card { width: 100%; max-width: 440px; text-align: center; }
  .logo { display: flex; justify-content: center; margin-bottom: 20px; }
  h1 { font-size: 30px; font-weight: 600; margin-bottom: 8px; }
  .sub { font-size: 15px; line-height: 1.7; opacity: 0.7; margin-bottom: 28px; }
  .field { margin-bottom: 16px; text-align: left; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input {
    width: 100%; height: 44px; padding: 0 12px; font-size: 15px;
    border: 1px solid #e0ddd2; border-radius: 8px; background: #fff; color: #1a1a1a;
  }
  input:focus { outline: 2px solid #F16E56; outline-offset: 1px; }
  button {
    width: 100%; height: 44px; border: none; border-radius: 8px;
    background: #1a1a1a; color: #f5f3ec; font-size: 15px; font-weight: 600;
    cursor: pointer; margin-top: 8px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { color: #d32f2f; font-size: 14px; margin-bottom: 16px; }
  .hint { font-size: 13px; opacity: 0.6; margin-top: 20px; line-height: 1.6; }
  .hint code { background: #e0ddd2; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="72" height="72" viewBox="0 0 96 96" aria-hidden="true">
      <rect width="96" height="96" rx="20" fill="#f5f3ec"/>
      <g transform="scale(0.8)">
        <circle cx="60" cy="60" r="32" fill="#F16E56"/>
        <circle cx="73" cy="49" r="29" fill="#193346"/>
      </g>
    </svg>
  </div>
  <h1>Starlog</h1>
  <p class="sub">A journal for focus and reflection.<br/>Point it at your own Supabase project to begin.</p>
  <div id="error" class="error" role="alert" style="display:none"></div>
  <div class="field">
    <label for="url">Supabase project URL</label>
    <input id="url" type="url" placeholder="https://xyz.supabase.co — or paste a setup link" autocomplete="off" />
  </div>
  <div class="field">
    <label for="key">Anon key</label>
    <input id="key" type="password" placeholder="eyJhbGciOi…" autocomplete="off" />
  </div>
  <button id="connect">Connect</button>
  <p class="hint">
    Find both in your Supabase dashboard under <code>Project Settings → API</code>.
    They stay on this device only.
  </p>
</div>
<script>
// Parse setup link from URL params (e.g. ?supabase_url=...&anon_key=...)
(function() {
  const params = new URLSearchParams(window.location.search);
  const linkUrl = (params.get('supabase_url') || '').trim().replace(/\/+$/, '');
  const linkKey = (params.get('anon_key') || '').trim();
  // Also support pasting the full setup link into the URL field
  const urlInput = document.getElementById('url');
  const keyInput = document.getElementById('key');
  if (linkUrl) urlInput.value = linkUrl;
  if (linkKey) {
    keyInput.value = linkKey;
    keyInput.focus();
  }
  // If URL field contains a setup link, extract params from it
  urlInput.addEventListener('input', function() {
    const v = urlInput.value;
    const qIndex = v.indexOf('?');
    if (qIndex >= 0) {
      try {
        const q = new URLSearchParams(v.slice(qIndex + 1));
        const u = (q.get('supabase_url') || '').trim().replace(/\/+$/, '');
        const k = (q.get('anon_key') || '').trim();
        if (u || k) {
          if (u) urlInput.value = u;
          if (k) keyInput.value = k;
        }
      } catch (e) { /* keep raw text */ }
    }
  });

  const errorEl = document.getElementById('error');
  const btn = document.getElementById('connect');

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }
  function clearError() {
    errorEl.style.display = 'none';
  }

  btn.addEventListener('click', async function() {
    clearError();
    const url = urlInput.value.trim().replace(/\/+$/, '');
    const anonKey = keyInput.value.trim();

    if (!/^https:\/\/[^.]+\.supabase\.co$/.test(url)) {
      showError('That doesn’t look like a Supabase project URL.');
      return;
    }
    if (anonKey.length < 20) {
      showError('That key looks too short — paste the full anon key.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Connecting…';
    try {
      // Verify by fetching capabilities (same as the SPA does)
      const res = await fetch(
        url + '/rest/v1/capabilities?select=spec_version,operations',
        { headers: { 'apikey': anonKey, 'Authorization': 'Bearer ' + anonKey } }
      );
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();
      if (!rows.length) throw new Error('No capabilities row');

      // Save to localStorage (same key the SPA reads)
      localStorage.setItem('starlog.supabase', JSON.stringify({ url, anonKey }));
      // Clear setup params from URL, go to the app
      window.location.href = '/';
    } catch (e) {
      showError('Couldn’t reach that project: ' + (e.message || 'unknown error'));
      btn.disabled = false;
      btn.textContent = 'Connect';
    }
  });
})();
</script>
</body>
</html>
