<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Starlog — a journal for focus and reflection</title>
    <meta
      name="description"
      content="Starlog is a journal for focus and reflection. Like looking at the moon."
    />
    <link rel="icon" type="image/svg+xml" href="/icons/starlog.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/starlog-32.png" />
    <link rel="apple-touch-icon" href="/icons/starlog-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Preload fonts: separate files, not inlined -->
    <link rel="preload" href="/fonts/manrope-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibmplexmono-400.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#f5f3ec" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Starlog" />
  </head>
  <body>
    <div id="root">
      <!-- Loading screen: shown while the SPA bundle loads. No-config users
           are redirected to /setup.html (a separate static page). -->
      <div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f5f3ec;color:#1a1a1a;font-family:system-ui,-apple-system,sans-serif">
        <svg width="64" height="64" viewBox="0 0 96 96" aria-hidden="true">
          <rect width="96" height="96" rx="20" fill="#f5f3ec"/>
          <g transform="scale(0.8)">
            <circle cx="60" cy="60" r="32" fill="#F16E56"/>
            <circle cx="73" cy="49" r="29" fill="#193346"/>
          </g>
        </svg>
        <div style="width:32px;height:32px;border-radius:50%;border:2px solid #e0ddd2;border-top-color:#8a8478;animation:sl-spin 0.8s linear infinite" aria-hidden="true"></div>
      </div>
      <style>
        @keyframes sl-spin{to{transform:rotate(360deg)}}
        @media (prefers-color-scheme:dark){
          #root>div:first-child{background:#1a1a1a!important;color:#f5f3ec!important}
        }
      </style>
    </div>
    <script>
      // No saved config? Go to the standalone setup page (no SPA bundle needed).
      try {
        if (!localStorage.getItem('starlog.supabase') && !location.search.includes('supabase_url')) {
          location.replace('/setup.html' + location.search);
        }
      } catch (e) { /* private mode */ }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
