<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Starlog — a journal for focus and reflection</title>
    <meta
      name="description"
      content="Starlog is a journal for focus and reflection. Like looking at the moon."
    />
    <link rel="icon" type="image/svg+xml" href="/icons/starlog.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/starlog-32.png" />
    <link rel="apple-touch-icon" href="/icons/starlog-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Preload fonts: separate files, not inlined -->
    <link rel="preload" href="/fonts/manrope-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibmplexmono-400.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#f5f3ec" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Starlog" />
    <style>
      /* Instant splash styles: in <head> so they apply before body renders */
      @keyframes sl-spin { to { transform: rotate(360deg); } }
      .sl-splash { min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #f5f3ec; }
      .sl-spinner { width: 48px; height: 48px; border-radius: 50%; border: 3px solid #e0ddd2; border-top-color: #8a8478; animation: sl-spin 0.8s linear infinite; }
      @media (prefers-color-scheme: dark) {
        .sl-splash { background: #1a1a1a; }
        .sl-spinner { border-color: #3a3a3a; border-top-color: #8a8478; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant splash: shows before the JS bundle parses -->
      <div class="sl-splash">
        <div class="sl-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
